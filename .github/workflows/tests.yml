name: tests

on:
  push:
  pull_request:

jobs:
  mortgage-approval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mortgage-approval
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Tests
        run: |
          set -o pipefail
          python -m pytest -q -W error::FutureWarning 2>&1 | tee pytest.log || {
            msg=$(tail -c 3000 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=pytest::$msg"; exit 1; }

  mars-image-classification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mars-image-classification
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Tests (synthetic images, no download)
