name: profile-data (mars-image-classification)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mars-image-classification
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install requests pillow
      - name: Download, verify and profile
        run: |
          set -o pipefail
          { python scripts/fetch_data.py && python scripts/profile_data.py; } 2>&1 | tee run.log || {
            msg=$(tail -c 2500 run.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=failed::$msg"; exit 1; }
          msg=$(tail -c 3000 run.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::notice title=profile::$msg"
      - name: Commit profile (counts only, no images)
        run: |
          git config user.name "yding-lab"
          git config user.email "235223309+yding-lab@users.noreply.github.com"
          git add data/PROFILE.json
          git diff --cached --quiet && exit 0
          git commit -m "mars-image-classification: data profile"
          git push origin "HEAD:${{ github.ref_name }}"
