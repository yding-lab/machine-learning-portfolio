name: profile-data (ai4mars-terrain-segmentation)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ai4mars-terrain-segmentation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install requests pillow numpy
      - name: Use the large /mnt disk for the 16 GB download
        run: sudo mkdir -p /mnt/ai4mars && sudo chown "$USER" /mnt/ai4mars && df -h /mnt | tail -1
      - name: Download, verify, extract MSL NAVCAM, profile
        env:
          AI4MARS_RAW_DIR: /mnt/ai4mars
        run: |
          set -o pipefail
          { python scripts/fetch_data.py && python scripts/profile_data.py; } 2>&1 | tee run.log || {
            msg=$(tail -c 2500 run.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=failed::$msg"; exit 1; }
          msg=$(tail -c 3500 run.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::notice title=profile::$msg"
      - name: Commit profile (names and counts only)
        run: |
          git config user.name "yding-lab"
          git config user.email "235223309+yding-lab@users.noreply.github.com"
          git add data/PROFILE.json
          git diff --cached --quiet && exit 0
          git commit -m "ai4mars-terrain-segmentation: data profile"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
